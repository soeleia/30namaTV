name: Android TV build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-home-cache-excludes: caches/build-cache-1
      - name: Install compile SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0' 'build-tools;37.0.0'
      - name: Restore private build inputs
        if: github.event_name != 'pull_request'
        env:
          PRIVATE_FONTS_PASSWORD: ${{ secrets.PRIVATE_FONTS_PASSWORD }}
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64, io, os, pathlib, subprocess, zipfile
          password = os.environ.get('PRIVATE_FONTS_PASSWORD')
          if password:
              data = subprocess.run(['gpg', '--batch', '--pinentry-mode', 'loopback', '--passphrase-fd', '0', '--decrypt', '.github/private-fonts.zip.gpg'], input=password.encode(), stdout=subprocess.PIPE, check=True).stdout
              with zipfile.ZipFile(io.BytesIO(data)) as archive:
                  allowed = {'peyda_bold.ttf', 'peyda_medium.ttf', 'peyda_semibold.ttf', 'yekanbakh_regular.ttf', 'yekanbakh_bold.ttf'}
                  assert set(archive.namelist()) == allowed
                  for name in allowed:
                      pathlib.Path('app/src/main/res/font', name).write_bytes(archive.read(name))
          key = os.environ.get('RELEASE_KEYSTORE_BASE64')
          if key:
              pathlib.Path('.signing').mkdir(mode=0o700, exist_ok=True)
              path = pathlib.Path('.signing/release.jks')
              path.write_bytes(base64.b64decode(key, validate=True))
              path.chmod(0o600)
          PY
      - name: Build and verify
        env:
          TV_STORE_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.RELEASE_STORE_PASSWORD || '' }}
        run: |
          if [[ -f .signing/release.jks ]]; then
            export RELEASE_KEYSTORE='.signing/release.jks'
            export RELEASE_STORE_PASSWORD="$TV_STORE_PASSWORD"
            export RELEASE_KEY_PASSWORD="$TV_STORE_PASSWORD"
            export RELEASE_KEY_ALIAS='30namatv'
          fi
          python3 scripts/tv-checks.py --self-test
          ./gradlew :app:testDebugUnitTest :app:lintRelease :app:assembleRelease :app:assembleDebug :app:assembleDebugAndroidTest --no-configuration-cache --max-workers=2
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/30namaTV.apk
          sha256sum dist/30namaTV.apk > dist/SHA256SUMS
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose dist/30namaTV.apk
          "$ANDROID_HOME/build-tools/37.0.0/zipalign" -c -P 16 -v 4 dist/30namaTV.apk
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test -f .signing/release.jks
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: optimized-apk
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: instrumentation-apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: build-reports
          path: app/build/reports/

  tv-tests:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: instrumentation-apks
          path: app/build/outputs/apk/
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 30
          target: android-tv
          arch: x86
          profile: tv_1080p
          cores: 2
          ram-size: 1536M
          heap-size: 128M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: false
          script: python3 scripts/tv-checks.py --serial emulator-5554
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: tv-reports-android11
          path: app/build/reports/tv-checks/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, tv-tests]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: optimized-apk
          path: dist/
      - name: Publish tested APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/30namaTV.apk dist/SHA256SUMS --repo "$GITHUB_REPOSITORY" --title "30namaTV $GITHUB_REF_NAME" --generate-notes
